    version_at_harvest: 0.1.0
    repository: https://github.com/pipeworx-io/mcp-opendatasoft
    official: false
    maintained_by: pipeworx-io (third party)
    kind: mcp-server
    note: >-
      Generic MCP server for Opendatasoft portals. Not published by
      ScottishPower or Opendatasoft. See mcp/scottishpower-mcp.yml.
