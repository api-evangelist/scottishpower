findings:
  summary: >-
    ScottishPower is the clean UK control case for the question of whether a data
    mandate is replicable. Britain never wrote one for the consumer. It wrote an
    infrastructure mandate — the Smart DCC monopoly under the Smart Energy Code —
    which produced a national smart-meter communications network that no
    unaffiliated developer can reach, and it wrote an open-network-data licence
    condition — Ofgem Data Best Practice under RIIO-ED2 — which produced a real,
    anonymous, OpenAPI-documented, CC-BY-licensed data API over 150 datasets. Both
    obligations land on the same parent company, and the results could not be more
    different. The wires business is open because it was told to be open, and it
    actually built the thing. The supply business is shut, publishes no developer
    portal, has four non-resolving developer subdomains and one 403 API host, runs
    its partner integrations on an internal WSO2 estate nobody outside can see, and
    returns 403 to any machine that asks it anything — including for its own
    robots.txt. Nothing compels it to do otherwise, and it doesn't. Meanwhile
    Britain's actually API-native supplier, Octopus, built a public developer API
    with no mandate at all and now licenses that platform to other utilities. The
    UK's evidence is therefore doubly awkward for mandate advocates and for mandate
    sceptics alike: the mandate that existed (network data) worked and produced a
    callable API; the mandate that never existed (consumer data) produced nothing
    at ScottishPower and everything at Octopus. Regulation explains the floor here,
    not the ceiling.
  mandateIsNotImplementation: >-
    Recorded as separate facts throughout, in both directions. For the
    smart-meter-infrastructure regime: coverage is certain by construction (a
    licensed GB supplier must be a SEC Party and DCC User) but NO register entry,
    endpoint, or conformant surface could be called to prove it, so the status is
    live-claimed-unverified and not live-implemented — the ruthless reading. For
    the Ofgem Data Best Practice licence condition: the implementation was proved
    by anonymous HTTP 200s against a catalogue, a swagger document, a legacy search
    endpoint and a DCAT-AP export, so it is recorded as live-implemented. No
    compliance page, press release, or vendor case study was treated as evidence of
    an implementation anywhere in this profile — and in ScottishPower's case none
    of them could even be read.
  contrastWithAustralia: >-
    AGL in Australia is designated, listed on a public machine-readable CDR
    register, and answers Consumer Data Standards discovery endpoints anonymously —
    consumer data mandated and live, market data absent. ScottishPower is the exact
    inverse: consumer data unmandated and absent, network data mandated and live.
    The statutory machinery Australia transplanted from banking into energy has no
    British counterpart, and the British instrument that does exist points at the
    network operator rather than at the customer's record.

