  apisYmlCreated: true
  openapiHarvested: 1
  apisListed: 2
  fabricationCheck: >-
    No host, endpoint, scope or specification was invented. Every baseURL in
    apis.yml returned HTTP 200 anonymously on 2026-07-27 and every documentation URL
    is either a verified 200 or a canonical ScottishPower / SP Energy Networks human
    URL explicitly recorded above as 403-unreadable. No consumer API was recorded
    because none is documented. No LinkedIn or GitHub property was recorded because
    neither could be verified (LinkedIn 404 to this client; the GitHub account is an
    empty user with zero repositories). No auth scheme was asserted beyond the
    apiKey scheme carried in the harvested specification itself.
